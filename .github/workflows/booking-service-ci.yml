name: Booking Service CI/CD

on:
  push:
    branches: [ main, development, "feature/**" ]
    paths:
      - "services/booking-service/**"
      - "Shared/**"

  pull_request:
    branches: [ main, development ]
    paths:
      - "services/booking-service/**"
      - "Shared/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore services/booking-service/booking-service.csproj

      - name: Build Booking Service
        run: dotnet build services/booking-service/booking-service.csproj --no-restore --configuration Release

            # Run booking-service unit tests
      - name: Run Unit Tests
        run: dotnet test services/booking-service/BookingService.Tests/BookingService.Tests.csproj --no-build --configuration Release --verbosity normal

      # Feature branches stop here: CI only

      - name: Login to Azure Container Registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image to ACR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/development' || github.ref == 'refs/heads/main')
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/booking-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/booking-service:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/booking-service:latest
