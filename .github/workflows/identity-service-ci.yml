name: Identity Service CI

on:
  push:
    branches: [ main, development ]
    paths:
      - "services/identity-service/**"
      - "services/identity-service.Tests/**"
      - "Shared/**"

  pull_request:
    branches: [ main, development ]
    paths:
      - "services/identity-service/**"
      - "services/identity-service.Tests/**"
      - "Shared/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: |
          dotnet restore services/identity-service/IdentityService.csproj
          dotnet restore services/identity-service.Tests/IdentityService.Tests.csproj

      - name: Build
        run: |
          dotnet build services/identity-service/IdentityService.csproj --no-restore
          dotnet build services/identity-service.Tests/IdentityService.Tests.csproj --no-restore

      - name: Run Unit Tests
        run: dotnet test services/identity-service.Tests/IdentityService.Tests.csproj --no-build --verbosity normal