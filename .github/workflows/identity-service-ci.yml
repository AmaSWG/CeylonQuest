name: Identity Service CI/CD

on:
  push:
    branches: [ main, development ]
    paths:
      - "services/identity-service/**"
      - "services/identity-service.Tests/**"
      - "Shared/**"

  pull_request:
    branches: [ main, development ]
    paths:
      - "services/identity-service/**"
      - "Shared/**"

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: |
          dotnet restore services/identity-service/IdentityService.csproj
          dotnet restore services/identity-service.Tests/identity-service.Tests/IdentityService.Tests.csproj

      - name: Build .NET Projects
        run: |
          dotnet build services/identity-service/IdentityService.csproj --no-restore
          dotnet build services/identity-service/identity-service.Tests/IdentityService.Tests.csproj --no-restore

      - name: Run Unit Tests
        run: dotnet test services/identity-service/identity-service.Tests/IdentityService.Tests.csproj --no-build --verbosity normal
        
      - name: Login to Azure Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push Docker image to ACR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/identity-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/identity-service:${{ github.sha }}
            ${{ secrets.ACR_LOGIN_SERVER }}/identity-service:latest